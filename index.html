<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5c8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>施工写真台帳</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --main:#1d5c8a; --main-dark:#144567; --accent:#e8710a; --bg:#eef1f4; --card:#fff;
  --line:#d3d9df; --text:#1e2a33; --sub:#66737f; --danger:#c62828;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--text);font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}

/* ===== 共通ボタン ===== */
.btn{min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600}
.btn:active{background:#e6ebef}
.btn.primary{background:var(--main);border-color:var(--main);color:#fff}
.btn.primary:active{background:var(--main-dark)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:#e3b3b3}
.btn.small{min-height:40px;font-size:14px;padding:0 10px}

/* ===== 画面共通 ===== */
.screen{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--main);color:#fff}
.top h1{margin:0;font-size:19px;flex:1}
.top .back{min-height:44px;min-width:64px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px}
.top .title{flex:1;min-width:0;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;min-height:44px;text-align:left;padding:0 10px;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .count{font-size:12px;text-align:right;white-space:nowrap;line-height:1.3}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:12px}

/* ===== ホーム ===== */
.lcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.lcard:active{background:#f3f6f8}
.lname{font-size:18px;font-weight:700;word-break:break-all}
.lmeta{color:var(--sub);font-size:13px;margin:4px 0 10px}
.lbtns{display:flex;gap:8px}
.note{color:var(--sub);font-size:13px;line-height:1.6;margin:16px 4px}
.empty{text-align:center;color:var(--sub);padding:36px 12px;line-height:1.8}

/* ===== 編集画面：一覧 ===== */
#editor{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.pagehead{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 6px;color:var(--sub);font-size:13px;font-weight:700}
.pagehead .btn{min-height:34px;font-size:13px}
.row{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;cursor:pointer}
.row:active{background:#f3f6f8}
.row .th{width:96px;height:72px;border-radius:6px;background:#dfe4e8;flex:none;object-fit:cover}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.row .no{font-weight:800;font-size:15px}
.row .no .k{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;background:#e3eef6;color:var(--main-dark);font-size:12px}
.row .pv{font-size:13px;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.row .pv.none{color:var(--accent)}
.row .ins{flex:none;width:58px;border:1px dashed var(--main);border-radius:8px;background:#f1f7fb;color:var(--main-dark);font-size:12px;font-weight:700;line-height:1.3}
.row .ins b{display:block;font-size:20px}

/* ===== 下部バー ===== */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.bar .btn{flex:1;min-height:52px;padding:0 6px;font-size:15px}
.bar .btn.cam{flex:1.5;font-size:16px}

/* ===== 編集シート／ダイアログ ===== */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.sheet-head{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--main);color:#fff}
.sheet-head .nav{min-height:44px;min-width:72px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px}
.sheet-head .nav:disabled{opacity:.35}
.sheet-head .ttl{flex:1;text-align:center;font-weight:800;font-size:18px}
.sheet-body{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:8px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1;min-height:52px}
.sec{max-width:760px;margin:0 auto 14px}
.sec>label{display:block;font-weight:700;font-size:14px;margin:0 0 6px;color:var(--sub)}
.ephoto{background:#222;border-radius:10px;display:flex;justify-content:center;align-items:center;height:min(46vh,420px)}
.ephoto img{max-width:100%;max-height:100%;object-fit:contain}
.tools{display:flex;gap:8px;margin-top:8px}
.tools .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:22px;background:#fff;font-weight:700}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.txt{width:100%;min-height:46px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px}
.txt:focus{outline:2px solid var(--main);border-color:var(--main)}
#eLines .txt{margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.dlg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg .box{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:420px}
.dlg h3{margin:0 0 12px;font-size:17px}
.dlg .btns{display:flex;gap:8px;margin-top:12px}
.dlg .btns .btn{flex:1}
.dlg .col{display:flex;flex-direction:column;gap:8px}

#busy{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;max-width:90%}

/* ===== プレビュー・印刷バー ===== */
#printbar{position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--main);color:#fff}
#printbar .back{min-height:44px;min-width:64px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px}
#printbar .ttl{flex:1;font-size:13px;line-height:1.4}
#printbar .btn{min-height:44px;padding:0 12px}

/* ===== プレビュー（出力するPDFと同じ画像を表示） ===== */
body.previewing{overflow:hidden}
#pvPages{position:fixed;left:0;right:0;bottom:0;top:calc(60px + env(safe-area-inset-top));z-index:65;overflow:auto;background:#7b838a;padding:10px 0}
#pvPages img{display:block;width:min(calc(100% - 16px),760px);height:auto;margin:0 auto 12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
</style>
</head>
<body>

<!-- ホーム：台帳の一覧 -->
<div id="home" class="screen">
  <header class="top"><h1>📷 施工写真台帳</h1></header>
  <div class="wrap">
    <button id="newLedger" class="btn primary" style="width:100%;min-height:56px;font-size:17px;margin-bottom:14px">＋ 新しい台帳をつくる</button>

    <div style="display:flex;gap:8px">

    </div>

      ・台帳のデータは、この端末のブラウザ内に自動で保存されます。<br>
      ・機種変更や、ブラウザの履歴削除に備えて、大事な台帳は「書き出し」でファイルに保存してください。
    </p>

</div>

<!-- 編集画面：写真の一覧 -->
<div id="editor" class="screen" hidden>
  <header class="top">
    <button class="back" id="edBack">‹ 一覧</button>
    <button class="title" id="edName"></button>
    <div class="count" id="edCount"></div>

  <div class="wrap" id="list"></div>
  <div class="bar">
    <button class="btn primary cam" id="addCam">📷 撮影して追加</button>
    <button class="btn" id="addAlbum">🖼 アルバム</button>
    <button class="btn accent" id="openPreview">📄 PDF</button>

</div>

<!-- 1枚ごとの編集シート -->
<div id="edit" class="sheet" hidden>
  <div class="sheet-head">
    <button class="nav" id="ePrev">‹ 前</button>
    <div class="ttl" id="eTitle"></div>
    <button class="nav" id="eNext">次 ›</button>

      <label>区分（施工前・施工中など）</label>

    <div class="sec">
      <label>この写真の次に挿入する</label>

        <button class="btn" id="eInsCam">📷 撮影して挿入</button>

</div>

<!-- 挿入方法の選択 -->
<div id="menu" class="dlg" hidden>
  <div class="box">
    <h3 id="menuTitle">写真を挿入</h3>
    <div class="col">
      <button class="btn primary" id="mCam" style="min-height:56px">📷 撮影して挿入</button>
      <button class="btn" id="mAlbum" style="min-height:56px">🖼 アルバムから選んで挿入</button>
      <button class="btn" id="mCancel">キャンセル</button>
    </div>
  </div>
</div>

<!-- 文字入力ダイアログ -->
<div id="ask" class="dlg" hidden>
  <div class="box">
    <h3 id="askTitle"></h3>
    <input class="txt" id="askInput" maxlength="60">
    <div class="btns">
      <button class="btn" id="askCancel">キャンセル</button>
      <button class="btn primary" id="askOk">OK</button>
    </div>
  </div>
</div>

<!-- プレビュー・印刷 -->
<div id="printbar" hidden>
  <button class="back" id="pvBack">‹ 戻る</button>
  <div class="ttl" id="pvInfo"></div>
  <button class="btn" id="pvShare" hidden>共有</button>
  <button class="btn accent" id="pvSave">PDF保存</button>
</div>
<div id="pvPages" hidden></div>

<div id="busy" hidden><span id="busyMsg">処理中…</span></div>
<div id="toast" hidden></div>

<datalist id="hist"></datalist>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileAlbum" accept="image/*" multiple hidden>
<input type="file" id="fileImport" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============================================================
   施工写真台帳
   ・台帳(ledgers)と写真(photos)をブラウザ内のIndexedDBに保存
   ・NO.は並び順から自動採番（挿入・並べ替えで自動的に振り直し）
   ・PDFは A4縦・1ページ3枚（アプリ内で画像として描いてPDF化）
   ============================================================ */
const LINES = 6;          // 内容の最大行数
const PER_PAGE = 3;       // 1ページあたりの写真数
const KINDS = ['施工前','施工中','施工後','完了','検査','材料'];
const HIST_KEY = 'shashin-daichou-hist';

const $ = id => document.getElementById(id);
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for(const k in (props||{})){
    const v = props[k];
    if(k === 'class') e.className = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for(const c of kids.flat()) if(c != null && c !== false) e.append(c);
  return e;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- IndexedDB ---------- */
let db;
function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('shashin-daichou', 1);
    r.onupgradeneeded = () => {
      r.result.createObjectStore('ledgers', {keyPath:'id'});
      r.result.createObjectStore('photos', {keyPath:'id'});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function dbReq(store, mode, fn){
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const q = fn(t.objectStore(store));
    t.oncomplete = () => res(q && q.result);
    t.onerror = t.onabort = () => rej(t.error);
  });
}
const dbGet = (s, id) => dbReq(s, 'readonly', o => o.get(id));
const dbAll = s => dbReq(s, 'readonly', o => o.getAll());
const dbPut = (s, v) => dbReq(s, 'readwrite', o => o.put(v));
const dbDel = (s, id) => dbReq(s, 'readwrite', o => o.delete(id));

/* ---------- 状態 ---------- */
let ledgers = [];     // 全台帳
let cur = null;       // 開いている台帳
let editIdx = -1;     // 編集シートで開いている写真の位置
let pending = null;   // 写真取り込みの目的 {type:'add',pos} / {type:'replace',idx}
const photos = new Map(); // photoId -> {blob, thumb, tUrl, pUrl}

/* ---------- 戻るボタン対応（画面の重なりを履歴で管理） ---------- */
const layers = [];
let skipPop = 0;
function pushLayer(closer){ layers.push(closer); history.pushState({l: layers.length}, ''); }
function closeTop(){ history.back(); }
function closeTopNow(){ const c = layers.pop(); if(c){ skipPop++; history.back(); c(); } }
window.addEventListener('popstate', () => {
  if(skipPop){ skipPop--; return; }
  const c = layers.pop(); if(c) c();
});

/* ---------- 画面部品 ---------- */
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200);
}
function busy(on, msg){ $('busy').hidden = !on; if(msg) $('busyMsg').textContent = msg; }

function askText(title, value){
  return new Promise(resolve => {
    let result = null;
    $('askTitle').textContent = title;
    $('askInput').value = value || '';
    $('ask').hidden = false;
    setTimeout(() => $('askInput').focus(), 50);
    const finish = ok => { result = ok ? $('askInput').value.trim() : null; closeTop(); };
    $('askOk').onclick = () => finish(true);
    $('askCancel').onclick = () => finish(false);
    $('askInput').onkeydown = e => { if(e.key === 'Enter') finish(true); };
    pushLayer(() => { $('ask').hidden = true; resolve(result); });
  });
}

/* ---------- 入力履歴（内容欄の候補） ---------- */
function getHist(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY)) || []; }catch(e){ return []; } }
function addHist(s){
  s = (s||'').trim(); if(!s) return;
  const a = getHist().filter(x => x !== s); a.unshift(s);
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(a.slice(0, 100))); }catch(e){}
  renderHist();
}
function renderHist(){ $('hist').replaceChildren(...getHist().map(s => h('option', {value:s}))); }

/* ---------- 写真の取り込み・加工 ---------- */
const photoUrl = (id, key, field) => {
  const p = photos.get(id); if(!p) return '';
  return p[key] || (p[key] = URL.createObjectURL(p[field]));
};
const thumbUrl = id => photoUrl(id, 'tUrl', 'thumb');
const fullUrl  = id => photoUrl(id, 'pUrl', 'blob');
function setPhoto(id, blob, thumb){
  releasePhoto(id);
  photos.set(id, {blob, thumb});
}
function releasePhoto(id){
  const p = photos.get(id); if(!p) return;
  if(p.tUrl) URL.revokeObjectURL(p.tUrl);
  if(p.pUrl) URL.revokeObjectURL(p.pUrl);
  photos.delete(id);
}
function releaseAllPhotos(){ for(const id of [...photos.keys()]) releasePhoto(id); }

function canvasBlob(cv, q){ return new Promise(r => cv.toBlob(r, 'image/jpeg', q)); }
function encode(img, rot, maxSide, q){
  const sw = img.naturalWidth, sh = img.naturalHeight;
  const turn = rot === 90 || rot === 270;
  const bw = turn ? sh : sw, bh = turn ? sw : sh;
  const k = Math.min(1, maxSide / Math.max(bw, bh));
  const cv = document.createElement('canvas');
  cv.width = Math.round(bw * k); cv.height = Math.round(bh * k);
  const c = cv.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height);
  c.translate(cv.width / 2, cv.height / 2);
  c.rotate(rot * Math.PI / 180);
  c.drawImage(img, -sw * k / 2, -sh * k / 2, sw * k, sh * k);
  return canvasBlob(cv, q);
}
// 元画像を台帳用(長辺1600px)と一覧用(長辺240px)に縮小。keep=true なら元の画像をそのまま使う
async function makePhoto(src, rot, keep){
  const url = URL.createObjectURL(src);
  try{
    const img = new Image(); img.src = url; await img.decode();
    const blob = keep ? src : await encode(img, rot, 1600, 0.85);
    const thumb = await encode(img, rot, 240, 0.7);
    return {blob, thumb};
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- 台帳の保存 ---------- */
let saveTimer = null;
function scheduleSave(){
  if(!cur) return;
  cur.updatedAt = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 300);
}
async function flushSave(){
  clearTimeout(saveTimer); saveTimer = null;
  if(cur) await dbPut('ledgers', cur);
}
document.addEventListener('visibilitychange', () => { if(document.hidden) flushSave(); });
window.addEventListener('pagehide', flushSave);

/* ---------- ホーム ---------- */
function renderHome(){
  const box = $('ledgerList');
  const list = [...ledgers].sort((a, b) => b.updatedAt - a.updatedAt);
  if(!list.length){
    box.replaceChildren(h('div', {class:'empty'}, 'まだ台帳がありません。', h('br'), '「新しい台帳をつくる」から始めてください。'));
    return;
  }
  box.replaceChildren(...list.map(l => h('div', {class:'lcard', onclick:() => openLedger(l.id)},
    h('div', {class:'lname'}, l.name || '（名称なし）'),
    h('div', {class:'lmeta'}, `${l.items.length}枚 ・ ${Math.ceil(l.items.length / PER_PAGE)}ページ ・ 更新 ${new Date(l.updatedAt).toLocaleDateString('ja-JP')}`),
    h('div', {class:'lbtns'},
      h('button', {class:'btn small', onclick:e => { e.stopPropagation(); exportLedger(l); }}, '書き出し'),
      h('button', {class:'btn small danger', onclick:e => { e.stopPropagation(); deleteLedger(l); }}, '削除')))));
}

$('newLedger').onclick = async () => {
  const name = await askText('工事名を入力してください', '');
  if(name === null) return;
  const l = {id: uid(), name: name || '無題の工事', createdAt: Date.now(), updatedAt: Date.now(), items: []};
  ledgers.push(l);
  await dbPut('ledgers', l);
  openLedger(l.id);
};

async function deleteLedger(l){
  if(!confirm(`「${l.name}」を削除します。\n写真もすべて消え、元に戻せません。\n（必要なら先に「書き出し」で保存してください）\n\n削除しますか？`)) return;
  for(const it of l.items) await dbDel('photos', it.photoId);
  await dbDel('ledgers', l.id);
  ledgers = ledgers.filter(x => x !== l);
  renderHome();
}

/* ---------- 書き出し・読み込み ---------- */
function saveFile(blob, fname){
  const a = h('a', {href:URL.createObjectURL(blob), download:fname});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 20000);
}
function blobToDataURL(b){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
}
async function exportLedger(l){
  busy(true, '書き出し中…');
  try{
    if(cur === l) await flushSave();
    const head = JSON.stringify({format:'shashin-daichou', version:1, ledger:l});
    const parts = [head.slice(0, -1) + ',"photos":{'];
    let first = true;
    for(const it of l.items){
      const rec = await dbGet('photos', it.photoId);
      if(!rec) continue;
      parts.push((first ? '' : ',') + JSON.stringify(it.photoId) + ':' + JSON.stringify(await blobToDataURL(rec.blob)));
      first = false;
    }
    parts.push('}}');
    saveFile(new Blob(parts, {type:'application/json'}), ((l.name || '台帳').replace(/[\\/:*?"<>|]/g, '_')) + '_写真台帳.json');
    toast('ファイルに書き出しました');
  }catch(e){
    alert('書き出しに失敗しました。\n' + e);
  }finally{ busy(false); }
}

$('importBtn').onclick = () => $('fileImport').click();
$('fileImport').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  busy(true, '読み込み中…');
  try{
    const data = JSON.parse(await f.text());
    if(data.format !== 'shashin-daichou' || !data.ledger) throw new Error('施工写真台帳のファイルではありません');
    const l = data.ledger;
    if(ledgers.some(x => x.id === l.id)){
      if(!confirm(`「${l.name}」は既にあります。\nファイルの内容で上書きしますか？`)) return;
    }
    for(const it of l.items){
      const url = data.photos && data.photos[it.photoId];
      if(!url) continue;
      const src = await (await fetch(url)).blob();
      const {blob, thumb} = await makePhoto(src, 0, true);
      await dbPut('photos', {id: it.photoId, blob, thumb});
    }
    await dbPut('ledgers', l);
    ledgers = ledgers.filter(x => x.id !== l.id); ledgers.push(l);
    renderHome();
    toast('読み込みました');
  }catch(err){
    alert('読み込めませんでした。\n' + err.message);
  }finally{ busy(false); }
};

/* ---------- 編集画面（一覧） ---------- */
async function openLedger(id){
  cur = ledgers.find(l => l.id === id);
  if(!cur) return;
  busy(true, '開いています…');
  try{
    await Promise.all(cur.items.map(async it => {
      const r = await dbGet('photos', it.photoId);
      if(r) setPhoto(it.photoId, r.blob, r.thumb);
    }));
  } finally { busy(false); }
  $('home').hidden = true; $('editor').hidden = false;
  window.scrollTo(0, 0);
  renderList();
  pushLayer(async () => {
    await flushSave();
    releaseAllPhotos();
    cur = null;
    $('editor').hidden = true; $('home').hidden = false;
    renderHome();
  });
}
$('edBack').onclick = closeTop;

$('edName').onclick = async () => {
  const name = await askText('工事名', cur.name);
  if(name === null || !name) return;
  cur.name = name; scheduleSave(); renderList();
};

function renderList(){
  const n = cur.items.length;
  $('edName').textContent = cur.name || '（工事名を入力）';
  $('edCount').innerHTML = `${n}枚<br>${Math.ceil(n / PER_PAGE)}ページ`;
  const box = $('list');
  if(!n){
    box.replaceChildren(h('div', {class:'empty'},
      'まだ写真がありません。', h('br'), '下の「撮影して追加」を押して、', h('br'), '現場の写真を撮ってください。'));
    return;
  }
  const kids = [];
  cur.items.forEach((it, i) => {
    if(i % PER_PAGE === 0){
      kids.push(h('div', {class:'pagehead'},
        h('span', {}, `― ${i / PER_PAGE + 1}ページ目 ―`),
        i === 0 ? h('button', {class:'btn', onclick:() => openInsertMenu(0)}, '＋ 先頭に挿入') : null));
    }
    const text = it.lines.filter(s => s.trim()).join(' / ');
    kids.push(h('div', {class:'row', 'data-i':i, onclick:() => openEdit(i)},
      h('img', {class:'th', src:thumbUrl(it.photoId), alt:''}),
      h('div', {class:'body'},
        h('div', {class:'no'}, `NO.${i + 1}`, it.kind ? h('span', {class:'k'}, it.kind) : null),
        h('div', {class:'pv' + (text ? '' : ' none')}, text || '（文字が未入力です）')),
      h('button', {class:'ins', onclick:e => { e.stopPropagation(); openInsertMenu(i + 1); }}, h('b', {}, '＋'), '次に挿入')));
  });
  box.replaceChildren(...kids);
}

/* ---------- 写真の追加・挿入 ---------- */
function openInsertMenu(pos){
  $('menuTitle').textContent = pos === 0 ? '先頭に写真を挿入' : `NO.${pos} の次に写真を挿入`;
  $('menu').hidden = false;
  $('mCam').onclick = () => { closeTopNow(); startPick({type:'add', pos}, true); };
  $('mAlbum').onclick = () => { closeTopNow(); startPick({type:'add', pos}, false); };
  $('mCancel').onclick = closeTop;
  pushLayer(() => { $('menu').hidden = true; });
}
function startPick(p, camera){
  pending = p;
  (camera ? $('fileCam') : $('fileAlbum')).click();
}
$('addCam').onclick = () => startPick({type:'add', pos:cur.items.length}, true);
$('addAlbum').onclick = () => startPick({type:'add', pos:cur.items.length}, false);
$('fileCam').onchange = e => onFiles(e);
$('fileAlbum').onchange = e => onFiles(e);

async function onFiles(e){
  const files = [...e.target.files]; e.target.value = '';
  const p = pending; pending = null;
  if(!files.length || !p || !cur) return;
  busy(true, '写真を取り込み中…');
  try{
    if(p.type === 'replace') await replacePhoto(p.idx, files[0]);
    else await addPhotos(files, p.pos);
  } finally { busy(false); }
}

async function addPhotos(files, pos){
  let ok = 0, ng = 0;
  const prevKind = pos > 0 ? cur.items[pos - 1].kind : '施工前';
  for(const f of files){
    try{
      const {blob, thumb} = await makePhoto(f, 0, false);
      const pid = uid();
      await dbPut('photos', {id:pid, blob, thumb});
      setPhoto(pid, blob, thumb);
      cur.items.splice(pos + ok, 0, {id:uid(), photoId:pid, kind:prevKind, lines:Array(LINES).fill('')});
      ok++;
    }catch(err){ ng++; }
  }
  if(ng) alert(`${ng}枚は読み込めませんでした。`);
  if(!ok) return;
  scheduleSave(); renderList();
  if(!$('edit').hidden){ editIdx = pos; fillEdit(); }
  else if(files.length === 1) openEdit(pos);
  else toast(`${ok}枚追加しました`);
}

async function replacePhoto(idx, file){
  try{
    const it = cur.items[idx];
    const {blob, thumb} = await makePhoto(file, 0, false);
    await dbPut('photos', {id:it.photoId, blob, thumb});
    setPhoto(it.photoId, blob, thumb);
    scheduleSave(); renderList(); fillEdit();
  }catch(err){ alert('この写真は読み込めませんでした。'); }
}

/* ---------- 1枚ごとの編集シート ---------- */
function initEditForm(){
  $('eChips').replaceChildren(...KINDS.map(k => h('button', {class:'chip', 'data-k':k, onclick:() => {
    cur.items[editIdx].kind = k; $('eKind').value = k; markChips(); scheduleSave();
  }}, k)));
  const lines = [];
  for(let k = 0; k < LINES; k++){
    lines.push(h('input', {class:'txt', list:'hist', maxlength:40, placeholder:`${k + 1}行目`, enterkeyhint:k < LINES - 1 ? 'next' : 'done',
      oninput:e => { cur.items[editIdx].lines[k] = e.target.value; scheduleSave(); },
      onchange:e => addHist(e.target.value),
      onkeydown:e => { if(e.key === 'Enter'){ e.preventDefault(); const n = $('eLines').children[k + 1]; n ? n.focus() : e.target.blur(); } }}));
  }
  $('eLines').replaceChildren(...lines);
}
function markChips(){
  const kind = cur.items[editIdx].kind;
  for(const c of $('eChips').children) c.classList.toggle('on', c.dataset.k === kind);
}
$('eKind').oninput = e => { cur.items[editIdx].kind = e.target.value; markChips(); scheduleSave(); };

function openEdit(i){
  editIdx = i;
  fillEdit();
  $('edit').hidden = false;
  $('edit').querySelector('.sheet-body').scrollTop = 0;
  pushLayer(() => {
    $('edit').hidden = true;
    renderList();
    const row = $('list').querySelector(`[data-i="${editIdx}"]`);
    if(row) row.scrollIntoView({block:'center'});
  });
}
function fillEdit(){
  const it = cur.items[editIdx]; if(!it) return;
  $('eTitle').textContent = `NO.${editIdx + 1}`;
  $('ePhoto').src = fullUrl(it.photoId);
  $('eKind').value = it.kind || '';
  markChips();
  [...$('eLines').children].forEach((inp, k) => inp.value = it.lines[k] || '');
  $('ePrev').disabled = editIdx <= 0;
  $('eNext').disabled = editIdx >= cur.items.length - 1;
  $('eUp').disabled = editIdx <= 0;
  $('eDown').disabled = editIdx >= cur.items.length - 1;
  $('eCopy').disabled = editIdx <= 0;
}
$('ePrev').onclick = () => { editIdx--; fillEdit(); $('edit').querySelector('.sheet-body').scrollTop = 0; };
$('eNext').onclick = () => { editIdx++; fillEdit(); $('edit').querySelector('.sheet-body').scrollTop = 0; };
$('eDone').onclick = closeTop;

$('eCopy').onclick = () => {
  const it = cur.items[editIdx], pv = cur.items[editIdx - 1];
  if(it.lines.some(s => s.trim()) && !confirm('今の内容を、前の写真の内容で置き換えますか？')) return;
  it.kind = pv.kind; it.lines = [...pv.lines];
  scheduleSave(); fillEdit();
};

function move(d){
  const a = cur.items, j = editIdx + d;
  if(j < 0 || j >= a.length) return;
  [a[editIdx], a[j]] = [a[j], a[editIdx]];
  editIdx = j; scheduleSave(); fillEdit(); renderList();
}
$('eUp').onclick = () => move(-1);
$('eDown').onclick = () => move(1);

$('eInsCam').onclick = () => startPick({type:'add', pos:editIdx + 1}, true);
$('eShootNext').onclick = () => startPick({type:'add', pos:editIdx + 1}, true);
$('eInsAlbum').onclick = () => startPick({type:'add', pos:editIdx + 1}, false);
$('eRetake').onclick = () => startPick({type:'replace', idx:editIdx}, true);
$('eReplace').onclick = () => startPick({type:'replace', idx:editIdx}, false);

$('eRotate').onclick = async () => {
  const it = cur.items[editIdx], p = photos.get(it.photoId);
  if(!p) return;
  busy(true, '回転中…');
  try{
    const {blob, thumb} = await makePhoto(p.blob, 90, false);
    await dbPut('photos', {id:it.photoId, blob, thumb});
    setPhoto(it.photoId, blob, thumb);
    fillEdit(); renderList();
  } finally { busy(false); }
};

$('eDel').onclick = async () => {
  if(!confirm(`NO.${editIdx + 1} の写真を削除します。元に戻せません。\n削除しますか？`)) return;
  const [it] = cur.items.splice(editIdx, 1);
  releasePhoto(it.photoId);
  await dbDel('photos', it.photoId);
  scheduleSave();
  editIdx = Math.min(editIdx, cur.items.length - 1);
  closeTop();
};

/* ---------- PDF出力（A4縦・1ページ3枚） ----------
   ブラウザの印刷機能は余白・URL・日時が付いたり縮小されたりするため使わず、
   ページを画像として描いてPDFにまとめる。 */
const PW = 210, PH = 297;           // A4（mm）
const K = 200 / 25.4;               // 1mmあたりのpx（200dpi）
const FONT = '"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif';
const ROW_TOPS = [24, 113, 202];    // 各段の上端（mm）
const FOOTER_NAME = 'TANIGUCHI metal plate Ltd';

// 文字を描く。maxMm に収まらないときは文字サイズを小さくする
function drawText(c, text, x, y, o){
  let pt = o.pt;
  do{
    c.font = `${o.weight || '400'} ${pt * 200 / 72}px ${FONT}`;
    if(!o.max || c.measureText(text).width <= o.max * K) break;
    pt -= 0.5;
  }while(pt > 6);
  c.textAlign = o.align || 'left';
  c.textBaseline = o.base || 'alphabetic';
  c.fillText(text, x * K, y * K);
}
function fillMm(c, color, x, y, w, h){ c.fillStyle = color; c.fillRect(x * K, y * K, w * K, h * K); }

async function renderPage(p, pages){
  const cv = document.createElement('canvas');
  cv.width = Math.round(PW * K); cv.height = Math.round(PH * K);
  const c = cv.getContext('2d');
  c.imageSmoothingQuality = 'high';
  c.fillStyle = '#fff'; c.fillRect(0, 0, cv.width, cv.height);   // 端の1pxまで白で塗る

  // ヘッダー（工事名）
  c.fillStyle = '#000';
  drawText(c, cur.name || '', 12, 17, {pt:10.5, weight:'700', max:130});
  drawText(c, '施工写真台帳', 198, 17, {pt:9, align:'right'});
  fillMm(c, '#000', 12, 18.8, 186, 0.4);

  // 写真3段
  for(let r = 0; r < PER_PAGE; r++){
    const i = p * PER_PAGE + r, it = cur.items[i];
    if(!it) continue;
    const top = ROW_TOPS[r];
    // 写真（枠の中に全体が収まるように表示）
    fillMm(c, '#fff', 12, top, 106, 80);
    const img = new Image(); img.src = fullUrl(it.photoId); await img.decode();
    const k = Math.min(106 / img.naturalWidth, 80 / img.naturalHeight);
    const dw = img.naturalWidth * k, dh = img.naturalHeight * k;
    c.drawImage(img, (12 + (106 - dw) / 2) * K, (top + (80 - dh) / 2) * K, dw * K, dh * K);
    c.strokeStyle = '#bbb'; c.lineWidth = 0.2 * K; c.strokeRect(12 * K, top * K, 106 * K, 80 * K);

    // 右側の記入欄
    const x0 = 126, x1 = 195, cx = (x0 + x1) / 2;
    c.fillStyle = '#000';
    c.font = `700 ${9 * 200 / 72}px ${FONT}`;
    const lw = c.measureText('NO.').width / K;
    drawText(c, 'NO.', x0, top + 10.2, {pt:9, weight:'700'});
    fillMm(c, '#333', x0 + lw + 1.5, top + 10.7, x1 - x0 - lw - 1.5, 0.3);
    drawText(c, String(i + 1), (x0 + lw + 1.5 + x1) / 2, top + 9.6, {pt:11, align:'center'});
    drawText(c, it.kind || '', cx, top + 17, {pt:13, weight:'700', align:'center', base:'middle', max:69});
    fillMm(c, '#222', x0, top + 21.4, x1 - x0, 0.6);
    c.strokeStyle = '#555'; c.lineWidth = 0.3 * K; c.setLineDash([0.3 * K, 0.7 * K]);
    for(let n = 0; n < LINES; n++){
      const yb = top + 22 + 8.4 * (n + 1);
      c.fillStyle = '#000';
      drawText(c, it.lines[n] || '', cx, yb - 4.2, {pt:10.5, align:'center', base:'middle', max:69});
      c.beginPath(); c.moveTo(x0 * K, (yb - 0.15) * K); c.lineTo(x1 * K, (yb - 0.15) * K); c.stroke();
    }
    c.setLineDash([]);
  }

  // フッター（ページ番号は中央、社名は右詰め）
  c.fillStyle = '#000';
  drawText(c, `${p + 1} / ${pages}`, PW / 2, 291, {pt:9, align:'center'});
  drawText(c, FOOTER_NAME, 198, 291, {pt:9, align:'right'});

  const blob = await canvasBlob(cv, 0.92);
  return {blob, url:URL.createObjectURL(blob), bytes:new Uint8Array(await blob.arrayBuffer()), w:cv.width, h:cv.height};
}

// JPEG画像のページをPDFにまとめる
function makePdf(pages){
  const enc = new TextEncoder(), parts = [], offs = [];
  let pos = 0;
  const push = d => { const u = typeof d === 'string' ? enc.encode(d) : d; parts.push(u); pos += u.length; };
  const obj = (n, body) => { offs[n] = pos; push(`${n} 0 obj\n${body}\nendobj\n`); };
  const W = 595.28, H = 841.89;
  push('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, `<< /Type /Pages /Kids [${pages.map((_, i) => `${3 + 3 * i} 0 R`).join(' ')}] /Count ${pages.length} >>`);
  pages.forEach((pg, i) => {
    const n = 3 + 3 * i, content = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    obj(n, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${n + 2} 0 R >> >> /Contents ${n + 1} 0 R >>`);
    obj(n + 1, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    offs[n + 2] = pos;
    push(`${n + 2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\nstream\n`);
    push(pg.bytes);
    push('\nendstream\nendobj\n');
  });
  const total = 3 + 3 * pages.length, xref = pos;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let k = 1; k < total; k++) x += String(offs[k]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts, {type:'application/pdf'});
}

let pvList = [];   // プレビュー中のページ画像
const pdfName = () => ((cur.name || '台帳').replace(/[\\/:*?"<>|]/g, '_')) + '_施工写真台帳.pdf';

async function openPreview(){
  if(!cur.items.length){ toast('写真がありません'); return; }
  busy(true, 'PDFを作成中…');
  try{
    const pages = Math.ceil(cur.items.length / PER_PAGE);
    pvList = [];
    for(let p = 0; p < pages; p++) pvList.push(await renderPage(p, pages));
  }catch(err){
    alert('PDFの作成に失敗しました。\n' + err);
    return;
  }finally{ busy(false); }
  $('pvPages').replaceChildren(...pvList.map(pg => h('img', {src:pg.url, alt:''})));
  $('pvPages').hidden = false; $('pvPages').scrollTop = 0;
  $('pvInfo').innerHTML = `${cur.items.length}枚 ・ ${pvList.length}ページ<br>A4縦・1ページ${PER_PAGE}枚`;
  document.body.classList.add('previewing');
  $('printbar').hidden = false;
  pushLayer(() => {
    document.body.classList.remove('previewing');
    $('printbar').hidden = true; $('pvPages').hidden = true;
    $('pvPages').replaceChildren();
    pvList.forEach(pg => URL.revokeObjectURL(pg.url));
    pvList = [];
  });
}
$('openPreview').onclick = openPreview;
$('pvBack').onclick = closeTop;
$('pvSave').onclick = () => { saveFile(makePdf(pvList), pdfName()); toast('PDFを保存しました'); };
$('pvShare').onclick = async () => {
  try{ await navigator.share({files:[new File([makePdf(pvList)], pdfName(), {type:'application/pdf'})], title:cur.name}); }
  catch(err){ if(err.name !== 'AbortError') alert('共有できませんでした。「PDF保存」を使ってください。'); }
};
// 端末の「共有」（印刷・ドライブ保存など）が使えるときだけ共有ボタンを出す
try{
  if(navigator.canShare && navigator.canShare({files:[new File(['x'], 'a.pdf', {type:'application/pdf'})]})) $('pvShare').hidden = false;
}catch(e){}

/* ---------- 起動 ---------- */
(async function init(){
  try{
    db = await openDB();
    ledgers = await dbAll('ledgers');
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
  }catch(e){
    alert('この環境ではデータを保存できません。\n（プライベートモードではないか確認してください）\n' + e);
  }
  initEditForm();
  renderHist();
  renderHome();
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
